name: hrm_app
description: HRM Mobile App
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.0

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.jpeg"

flutter:
  uses-material-design: true
